# Run the app with its own PostgreSQL database:
#
#   cp .env.example .env        # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Then open http://localhost:3000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file (see .env.example)}
      POSTGRES_DB: tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tasks:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://tasks:${POSTGRES_PASSWORD}@db:5432/tasks
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file (see .env.example)}
      # Set to "false" only when serving over plain HTTP (no HTTPS proxy), otherwise browsers drop the login cookie.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Optional: AI helpers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      # Optional: Google Calendar / Gmail. All four are needed together.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-}
    restart: unless-stopped

volumes:
  pgdata:
